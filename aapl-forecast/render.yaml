# Render Blueprint (optional). You can also create the service by hand in the dashboard.
services:
  - type: web
    name: aapl-forecast-api
    runtime: python
    rootDir: backend
    plan: free            # TensorFlow needs ~500MB RAM; if the service crashes, switch to "starter"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: FEATURES
        value: Close
      - key: CORS_ORIGINS
        value: https://YOUR-APP.vercel.app
